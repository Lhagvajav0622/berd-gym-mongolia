function useMedia(query) {
  const [match, setMatch] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const fn = (e) => setMatch(e.matches);
    setMatch(mq.matches);
    mq.addEventListener('change', fn);
    return () => mq.removeEventListener('change', fn);
  }, [query]);
  return match;
}

/* ── BUTTON ───────────────────────────────────────────────────── */
function Button({ children, variant = 'primary', size = 'lg', fullWidth = false, icon = null, as: Tag = 'button', href, disabled = false, onClick, style = {}, ...rest }) {
  const heights = { lg: 'var(--control-h)', md: 'var(--control-h-sm)', sm: '38px' };
  const padX    = { lg: '28px', md: '22px', sm: '16px' };
  const fsMap   = { lg: '18px', md: '16px', sm: '14px' };

  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 10,
    height: heights[size], padding: `0 ${padX[size]}`,
    width: fullWidth ? '100%' : 'auto',
    fontFamily: 'var(--font-display)', fontWeight: 700,
    textTransform: 'uppercase', letterSpacing: '0.04em', fontSize: fsMap[size],
    borderRadius: 'var(--radius-pill)', border: '0',
    cursor: disabled ? 'not-allowed' : 'pointer',
    opacity: disabled ? 0.45 : 1,
    textDecoration: 'none', whiteSpace: 'nowrap', userSelect: 'none',
  };

  const variants = {
    primary:   { background: 'var(--grad-orange-metal)', color: 'var(--ink-on-orange)', boxShadow: 'var(--glow-cta), var(--inset-glint)' },
    secondary: { background: 'transparent', color: 'var(--orange)', boxShadow: 'inset 0 0 0 2px var(--orange)' },
    dark:      { background: 'var(--surface-2)', color: 'var(--text-primary)', boxShadow: 'inset 0 0 0 1px var(--surface-line-2)' },
    ghost:     { background: 'transparent', color: 'var(--text-primary)', boxShadow: 'none' },
  };

  const El = Tag === 'a' ? 'a' : 'button';
  const extra = El === 'a' ? { href } : { disabled, type: rest.type || 'button' };

  return (
    <El
      className={'berd-btn berd-btn--' + variant}
      onClick={disabled ? undefined : onClick}
      style={{ ...base, ...variants[variant], ...style }}
      {...extra}
      {...rest}
    >
      {icon ? <span style={{ display: 'inline-flex', fontSize: '1.15em' }}>{icon}</span> : null}
      <span>{children}</span>
    </El>
  );
}

/* ── QR CHECKOUT ──────────────────────────────────────────────── */
function buildQRMatrix(seed, n) {
  const cells = [];
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const isFinder = (r, c) => {
    const inBox = (br, bc) => r >= br && r < br + 7 && c >= bc && c < bc + 7;
    return inBox(0, 0) || inBox(0, n - 7) || inBox(n - 7, 0);
  };
  const finderOn = (r, c) => {
    const f = (br, bc) => {
      const rr = r - br, cc = c - bc;
      if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return null;
      const ring = rr === 0 || rr === 6 || cc === 0 || cc === 6;
      const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
      return ring || core;
    };
    const a = f(0, 0), b = f(0, n - 7), d = f(n - 7, 0);
    return a ?? b ?? d;
  };
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (isFinder(r, c)) cells.push(finderOn(r, c) ? 1 : 0);
      else cells.push(rnd() > 0.5 ? 1 : 0);
    }
  }
  return cells;
}

              background: 'var(--surface-1)', color: 'var(--grey)',
              fontSize: 17, cursor: 'pointer',
            }}
          >✕</button>
        </div>

        {step === 'details' ? (
          <div>
            {/* Plan summary */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
              padding: '14px 16px', borderRadius: 'var(--radius-md)',
              background: 'var(--surface-1)', border: '1px solid var(--surface-line-2)',
            }}>
              <div>
                <div style={{
                  fontFamily: 'var(--font-display)', fontWeight: 700,
                  textTransform: 'uppercase', fontSize: 18, color: '#fff',
                }}>{plan.title}</div>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: 13, color: 'var(--grey)' }}>{plan.subtitle}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div
                  className="berd-metal-text"
                  style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 30, lineHeight: 1 }}
                >{plan.amount}</div>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: 'var(--text-muted)' }}>{plan.unit}</div>
              </div>
            </div>

            {/* Form fields */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginTop: 18 }}>
              <div>
                <label style={{
                  display: 'block', marginBottom: 7,
                  fontFamily: 'var(--font-display)', fontWeight: 600,
                  textTransform: 'uppercase', letterSpacing: '.08em',
                  fontSize: 12.5, color: 'var(--text-secondary)',
                }}>Нэр</label>
                <input
                  type="text"
                  placeholder="Таны нэр"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  style={{
                    width: '100%', height: 'var(--control-h-sm)',
                    padding: '0 14px',
                    background: 'var(--surface-2)',
                    border: '1px solid var(--surface-line-2)',
                    borderRadius: 'var(--radius-md)',
                    color: '#fff',
                    fontFamily: 'var(--font-body)', fontSize: 15,
                    outline: 'none', boxSizing: 'border-box',
                  }}
                />
              </div>
              <div>
                <label style={{
                  display: 'block', marginBottom: 7,
                  fontFamily: 'var(--font-display)', fontWeight: 600,
                  textTransform: 'uppercase', letterSpacing: '.08em',
                  fontSize: 12.5, color: 'var(--text-secondary)',
                }}>Утас</label>
                <div style={{ position: 'relative' }}>
                  <span style={{
                    position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)',
                    fontFamily: 'var(--font-body)', fontWeight: 600,
                    fontSize: 15, color: 'var(--text-secondary)',
                    pointerEvents: 'none',
                  }}>+976</span>
                  <input
                    type="tel"
                    placeholder="8800 0000"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    style={{
                      width: '100%', height: 'var(--control-h-sm)',
                      padding: '0 14px 0 54px',
                      background: 'var(--surface-2)',
                      border: '1px solid var(--surface-line-2)',
                      borderRadius: 'var(--radius-md)',
                      color: '#fff',
                      fontFamily: 'var(--font-body)', fontSize: 15,
                      outline: 'none', boxSizing: 'border-box',
                    }}
                  />
                </div>
              </div>
            </div>

            {/* Total */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              marginTop: 20, paddingTop: 16,
              borderTop: '1px solid var(--surface-line)',
            }}>
              <span style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--grey)' }}>Нийт төлбөр</span>
              <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 24, color: '#fff' }}>{plan.amountFull}</span>
            </div>

            <div style={{ marginTop: 18 }}>
              <Button fullWidth onClick={() => setStep('qr')}>QPay-ээр төлөх</Button>
            </div>
            <p style={{ margin: '12px 0 0', textAlign: 'center', fontFamily: 'var(--font-body)', fontSize: 12, color: 'var(--text-muted)' }}>
              Төлбөр төлснөөр гишүүнчлэл идэвхжинэ.
            </p>
          </div>
        ) : (
          <div>
            <QRCheckout
              plan={plan.title}
              amount={plan.amountFull}
              status={paid ? 'paid' : 'waiting'}
              expiresLabel="04:58"
              onBack={() => setStep('details')}
            />
            <div style={{ marginTop: 16 }}>
              {!paid
                ? <Button variant="secondary" fullWidth onClick={() => setPaid(true)}>Төлбөр шалгах</Button>
                : <Button fullWidth onClick={onClose}>Дуусгах</Button>
              }
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── APP ──────────────────────────────────────────────────────── */
function App() {
  const isDesktop = useMedia(DESKTOP);
  const [promo, setPromo] = useState(true);
  const [checkout, setCheckout] = useState(null);
  const openFeatured = () => setCheckout(PLANS[1]);

  return (
    <div>
      {promo && (
        <PromoBanner
          onJoin={(e) => { e.stopPropagation(); openFeatured(); }}
          onClose={() => setPromo(false)}
        />
      )}
      <Header onJoin={openFeatured} />
      <Hero onJoin={openFeatured} />
      <Features />
      <Pricing onSelect={setCheckout} />
      <PTHighlight onSelect={setCheckout} />
      <Footer />
      {!isDesktop && <StickyCTA onJoin={openFeatured} />}
      {checkout && <Checkout plan={checkout} onClose={() => setCheckout(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
