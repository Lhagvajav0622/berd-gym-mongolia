<!-- @startingPoint section="Landing" subtitle="Hero direction: full-bleed athlete + mega price" viewport="430x900" -->
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BERD GYM — Direction A</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  .screen { max-width: 430px; margin: 0 auto; background: var(--berd-black); min-height: 100%; }
  .promo { display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--grad-orange-flat); box-shadow:var(--glow-sm); }
  .promo .tag { font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:11px; padding:3px 8px; border-radius:999px; background:rgba(20,10,0,.85); color:var(--orange-bright); }
  .promo .msg { font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--ink-on-orange); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; }
  header img { height:34px; }
  header .ph { font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--orange); letter-spacing:.02em; }
  .hero { position:relative; min-height:660px; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
  .hero .bg { position:absolute; inset:0; background:url('../../assets/imagery/athlete-torso.jpg') center 12%/cover; }
  .hero .scrim { position:absolute; inset:0; background:var(--grad-hero-scrim); }
  .hero .glow { position:absolute; inset:0; background:var(--grad-orange-glow); mix-blend-mode:screen; opacity:.7; }
  .hero .inner { position:relative; padding:24px 20px 26px; }
  .eyebrow { font-family:var(--font-display); font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--orange); font-size:12px; }
  .h1 { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.9; letter-spacing:-.01em; font-size:54px; color:#fff; margin:10px 0 0; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .h1 .o { color:var(--orange); }
  .pricerow { display:flex; align-items:flex-end; gap:14px; margin-top:18px; }
  .old { font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--text-muted); text-decoration:line-through; text-decoration-color:var(--danger); text-decoration-thickness:3px; padding-bottom:14px; }
  .price { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.82; letter-spacing:-.02em; font-size:104px; background:var(--grad-orange-metal); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 6px 18px rgba(247,148,29,.4)); }
  .price .k { font-size:.62em; }
  .term { font-family:var(--font-display); font-weight:600; text-transform:uppercase; color:var(--grey); font-size:15px; padding-bottom:18px; }
  .cta { display:flex; gap:12px; margin-top:22px; }
  .btn { flex:1; height:56px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:18px; border-radius:999px; border:none; cursor:pointer; }
  .btn-p { background:var(--grad-orange-metal); color:var(--ink-on-orange); box-shadow:var(--glow-cta), var(--inset-glint); }
  .btn-s { flex:0 0 auto; padding:0 22px; background:transparent; color:var(--orange); box-shadow:inset 0 0 0 2px var(--orange); }
  .meta { display:flex; gap:18px; margin-top:20px; flex-wrap:wrap; }
  .meta div { font-family:var(--font-body); font-size:12.5px; color:var(--text-secondary); }
  .meta b { color:#fff; font-weight:700; display:block; font-family:var(--font-display); letter-spacing:.04em; text-transform:uppercase; font-size:14px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="promo"><span class="tag">Наадам</span><span class="msg">Бүх багцад 20% хямдрал →</span></div>
    <header>
      <img src="../../assets/logo-berdgym-dark.png" alt="BERD GYM">
      <span class="ph">86661231</span>
    </header>
    <section class="hero">
      <div class="bg"></div><div class="scrim"></div><div class="glow"></div>
      <div class="inner">
        <div class="eyebrow">BERD GYM · Улаанбаатар</div>
        <h1 class="h1">Хүч чинь<br><span class="o">дотроос</span> эхэлнэ</h1>
        <div class="pricerow">
          <span class="old">300K</span>
          <span class="price">250<span class="k">K</span></span>
          <span class="term">/ сар</span>
        </div>
        <div class="cta">
          <button class="btn btn-p">Гишүүн болох</button>
          <button class="btn btn-s">Үнэ</button>
        </div>
        <div class="meta">
          <div><b>06:00–22:00</b>Өдөр бүр</div>
          <div><b>3, 4 хороолол</b>Салбар</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
