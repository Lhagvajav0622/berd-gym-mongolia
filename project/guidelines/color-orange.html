<!-- @dsCard group="Colors" viewport="700x190" name="Brand orange" subtitle="The single accent — used boldly for prices, CTAs, headlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); height: 78px; box-shadow: var(--glow-sm); }
  .lab { margin-top: 10px; font-family: var(--font-body); }
  .lab .n { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .lab .h { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="sw" style="background:var(--orange-hot)"></div>
      <div class="lab"><div class="n">Hot</div><div class="h">#FFD27A</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--orange-bright)"></div>
      <div class="lab"><div class="n">Bright</div><div class="h">#FFB23E</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--orange); box-shadow:var(--glow-md)"></div>
      <div class="lab"><div class="n">Orange ★</div><div class="h">#F7941D</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--orange-deep)"></div>
      <div class="lab"><div class="n">Deep</div><div class="h">#E07A0C</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--orange-ember)"></div>
      <div class="lab"><div class="n">Ember</div><div class="h">#B85F05</div></div>
    </div>
  </div>
</body>
</html>
