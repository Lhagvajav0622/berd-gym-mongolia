<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; }
  .lead { font-family:var(--font-body); font-size:18px; font-weight:600; color:var(--text-primary); line-height:1.5; max-width:560px; }
  .p { font-family:var(--font-body); font-size:15px; color:var(--text-secondary); line-height:1.6; max-width:560px; margin-top:12px; }
  .meta { margin-top:16px; font-family:var(--font-body); font-size:12.5px; color:var(--text-muted); display:flex; gap:18px; flex-wrap:wrap; }
  .meta b { color:var(--grey); font-weight:600; }
</style>
</head>
<body>
  <div class="lead">Мэргэжлийн багш дасгалжуулагчтай, хоолны зөвлөгөө болон зөв техник.</div>
  <p class="p">06:00–22:00 цагт нээлттэй. 3, 4 хороолол салбар. Онлайн бүртгэл хийлгээд ирсэн өдрөөсөө эхлүүлэх боломжтой.</p>
  <div class="meta">
    <span><b>Font</b> Manrope</span>
    <span><b>Weights</b> 400 / 600 / 700</span>
    <span><b>Leading</b> 1.6</span>
  </div>
</body>
</html>
