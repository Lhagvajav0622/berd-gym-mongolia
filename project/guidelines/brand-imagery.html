<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  figure { margin:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--surface-line); position:relative; aspect-ratio:1/1; }
  figure img { width:100%; height:100%; object-fit:cover; }
  figcaption { position:absolute; left:8px; bottom:7px; font-family:var(--font-display); text-transform:uppercase; font-size:10.5px; font-weight:600; letter-spacing:.06em; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.9); }
</style>
</head>
<body>
  <div class="grid">
    <figure><img src="../assets/imagery/poster-statue.jpg" alt=""><figcaption>Statue / timeless power</figcaption></figure>
    <figure><img src="../assets/imagery/athlete-price.jpg" alt=""><figcaption>Athlete + glow</figcaption></figure>
    <figure><img src="../assets/imagery/coach-class.jpg" alt=""><figcaption>Coached class</figcaption></figure>
    <figure><img src="../assets/imagery/before-after.jpg" alt=""><figcaption>Before / after</figcaption></figure>
  </div>
</body>
</html>
