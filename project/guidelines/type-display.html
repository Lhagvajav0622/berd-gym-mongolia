<!-- @dsCard group="Type" viewport="700x230" name="Display headline" subtitle="Oswald 700, uppercase, tight tracking — the poster headline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; }
  .h1 { font-family: var(--font-display); font-weight:700; text-transform:uppercase; line-height:.9; letter-spacing:var(--ls-display); font-size:64px; color:var(--text-primary); }
  .h1 .o { color: var(--orange); }
  .meta { margin-top:18px; font-family:var(--font-body); font-size:12.5px; color:var(--text-muted); display:flex; gap:18px; flex-wrap:wrap; }
  .meta b { color: var(--grey); font-weight:600; }
</style>
</head>
<body>
  <div class="h1">Бэрд<br>дотор <span class="o">хүчтэй</span></div>
  <div class="meta">
    <span><b>Font</b> Oswald</span>
    <span><b>Weight</b> 700</span>
    <span><b>Case</b> UPPERCASE</span>
    <span><b>Tracking</b> −0.01em</span>
    <span><b>Leading</b> 0.92</span>
  </div>
</body>
</html>
