<!-- @dsCard group="Components" viewport="700x560" name="Price, features & membership" subtitle="The signature price block, check-marks, pricing tiers & promo bar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 24px; }
  .stack { display:flex; flex-direction:column; gap:24px; }
  .cap { font-family:var(--font-display); text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--text-muted); margin-bottom:12px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { PriceBlock, FeatureCheck, MembershipCard, PromoBanner } = window.BERDGYMDesignSystem_75db46;
    function Demo() {
      return (
        <div className="stack">
          <div style={{borderRadius:'12px', overflow:'hidden', border:'1px solid var(--surface-line)'}}>
            <PromoBanner label="Наадам" message="Бүх багцад 20% хямдрал" cta="Авах" onClose={()=>{}} />
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1.1fr 1fr', gap:20, alignItems:'center'}}>
            <div>
              <div className="cap">Signature price</div>
              <PriceBlock amount="160K" oldAmount="200K" unit="/ 3 сар" size="lg" />
            </div>
            <div>
              <div className="cap">Check-marks</div>
              <div style={{display:'flex', flexDirection:'column', gap:11}}>
                <FeatureCheck>7 хоногт 4–5 удаа бэлтгэл</FeatureCheck>
                <FeatureCheck>Хоолны дэглэм • Cardio</FeatureCheck>
                <FeatureCheck>Хувийн дасгалжуулагч</FeatureCheck>
              </div>
            </div>
          </div>
          <div>
            <div className="cap">Membership tiers</div>
            <div className="cards">
              <MembershipCard title="1 сар" subtitle="Чөлөөт бүртгэл"
                amount="300K" unit="/ сар"
                features={['Бүх тренажер', '06:00–22:00']} />
              <MembershipCard title="Багштай" subtitle="Дасгалжуулагчтай"
                amount="250K" oldAmount="300K" unit="/ сар"
                features={['7 хоногт 4–5 удаа', 'Хоолны дэглэм', 'Хувийн төлөвлөгөө']}
                featured badge="Эрэлттэй" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
