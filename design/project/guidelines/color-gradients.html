<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-md); height: 84px; }
  .lab { margin-top: 9px; font-family: var(--font-body); }
  .lab .n { font-size: 13px; font-weight: 700; }
  .lab .h { font-size: 11.5px; color: var(--text-muted); }
  .scrim { position:relative; background: var(--surface-3); overflow:hidden; }
  .scrim::after { content:""; position:absolute; inset:0; background: var(--grad-hero-scrim); }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="sw" style="background:var(--grad-orange-metal); box-shadow:var(--glow-sm)"></div>
      <div class="lab"><div class="n">Orange metal</div><div class="h">--grad-orange-metal</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--grad-orange-flat)"></div>
      <div class="lab"><div class="n">Orange flat</div><div class="h">--grad-orange-flat</div></div>
    </div>
    <div>
      <div class="sw scrim"></div>
      <div class="lab"><div class="n">Hero scrim</div><div class="h">--grad-hero-scrim</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--orange); box-shadow:var(--glow-lg)"></div>
      <div class="lab"><div class="n">Orange glow</div><div class="h">--glow-lg</div></div>
    </div>
  </div>
</body>
</html>
