<!-- @dsCard group="Spacing" viewport="700x180" name="Radii & borders" subtitle="Corner radii from chips to hero panels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; }
  .row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .box { width:92px; height:78px; background:var(--surface-2); border:1px solid var(--surface-line-2); display:flex; align-items:flex-end; justify-content:center; }
  .lab { font-family:var(--font-body); font-size:11px; color:var(--grey); font-weight:700; padding-bottom:7px; }
  .pill { width:120px; height:46px; border-radius:var(--radius-pill); background:var(--grad-orange-flat); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); text-transform:uppercase; font-weight:700; color:var(--ink-on-orange); font-size:13px; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="box" style="border-radius:var(--radius-sm)"><span class="lab">sm 10</span></div>
    <div class="box" style="border-radius:var(--radius-md)"><span class="lab">md 14</span></div>
    <div class="box" style="border-radius:var(--radius-lg)"><span class="lab">lg 20</span></div>
    <div class="box" style="border-radius:var(--radius-xl)"><span class="lab">xl 28</span></div>
    <div class="pill">Pill 999</div>
  </div>
</body>
</html>
