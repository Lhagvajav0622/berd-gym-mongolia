<!-- @dsCard group="Type" viewport="700x200" name="Eyebrow & slanted italic" subtitle="Wide-tracked orange labels and skewed poster energy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; }
  .eyebrow { font-family:var(--font-display); font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--orange); font-size:14px; }
  .slant { margin-top:16px; }
  .slant span { display:inline-block; transform:skewX(-9deg); font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:46px; line-height:1; letter-spacing:-.01em; color:var(--text-primary); }
  .slant .o { color:var(--orange); }
  .meta { margin-top:18px; font-family:var(--font-body); font-size:12.5px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="eyebrow">Багштай анги • Хувийн дасгал</div>
  <div class="slant"><span>Хувийн <span class="o">дасгалжуулалт</span></span></div>
  <div class="meta">Slant via <b style="color:var(--grey)">transform: skewX(−9deg)</b> — Oswald ships no true italic.</div>
</body>
</html>
