<!-- @dsCard group="Colors" viewport="700x190" name="Grounds & surfaces" subtitle="Near-black backgrounds and elevated dark surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); border: 1px solid var(--surface-line); height: 78px; }
  .lab { margin-top: 10px; font-family: var(--font-body); }
  .lab .n { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .lab .h { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="sw" style="background:var(--berd-black-deep)"></div>
      <div class="lab"><div class="n">Black Deep</div><div class="h">#080808</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--berd-black)"></div>
      <div class="lab"><div class="n">Page Black</div><div class="h">#0E0E0E</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--surface-1)"></div>
      <div class="lab"><div class="n">Surface 1</div><div class="h">#1A1A1A</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--surface-2)"></div>
      <div class="lab"><div class="n">Surface 2</div><div class="h">#222222</div></div>
    </div>
    <div>
      <div class="sw" style="background:var(--surface-3)"></div>
      <div class="lab"><div class="n">Surface 3</div><div class="h">#2C2C2C</div></div>
    </div>
  </div>
</body>
</html>
