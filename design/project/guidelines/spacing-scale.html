<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base rhythm — gaps, padding, section rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .item { text-align:center; font-family:var(--font-body); }
  .bar { width:30px; background:var(--grad-orange-flat); border-radius:4px 4px 0 0; }
  .item .n { margin-top:8px; font-size:11px; color:var(--grey); font-weight:700; }
  .item .v { font-size:10.5px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><div class="n">2</div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="n">3</div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="n">4</div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="n">5</div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="n">6</div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="n">8</div><div class="v">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="n">9</div><div class="v">64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="n">10</div><div class="v">80</div></div>
  </div>
</body>
</html>
